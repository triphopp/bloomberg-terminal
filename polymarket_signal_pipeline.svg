<text x="470" y="314" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250,249,245);font-size:13px;font-weight:500;font-family:monospace;">Extract  outcomePrices[0]  =  implied probability (0–1)</text>
<text x="470" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194,192,182);font-size:11px;font-family:monospace;">fallback: tokens[0].price  →  (bestBid + bestAsk) / 2  →  sort by volume  →  top-1 per type</text>

