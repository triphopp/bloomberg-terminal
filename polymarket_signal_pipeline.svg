<svg width="100%" viewBox="0 0 940 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Polymarket Signal Extraction Pipeline</title>
<desc>Full pool fetch approach: 3,000 active markets fetched from Gamma API → client-side phrase keyword match → 8 signal types → implied probability extraction</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ═══════════════════════════════════════════════════════════
     LAYER 1 — Market Discovery
═══════════════════════════════════════════════════════════ -->
<text x="40" y="44" style="font-size:11px;fill:rgb(156,154,146);font-family:monospace;">ชั้น 1 — Market Discovery</text>
<rect x="40" y="54" width="860" height="86" rx="10" style="fill:rgb(38,38,36);stroke:rgba(222,220,209,0.3);stroke-width:0.5px;stroke-dasharray:4px,3px;"/>

<!-- Gamma API box -->
<g onclick="sendPrompt('Gamma API /markets endpoint ใช้ params อะไรได้บ้าง')">
  <rect x="58" y="68" width="168" height="58" rx="8" style="fill:rgb(8,80,65);stroke:rgb(93,202,165);stroke-width:0.5px;"/>
  <text x="142" y="88" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:13px;font-weight:500;font-family:monospace;">Gamma API</text>
  <text x="142" y="106" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:11px;font-family:monospace;">gamma-api.polymarket.com</text>
  <text x="142" y="120" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:10px;font-family:monospace;">limit / offset / active / closed</text>
</g>

<!-- Arrow -->
<line x1="226" y1="97" x2="266" y2="97" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

<!-- Full pool fetch box -->
<g onclick="sendPrompt('ทำไม tag_slug และ q param ของ Gamma API ถึงไม่ทำงาน')">
  <rect x="266" y="68" width="232" height="58" rx="8" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);stroke-width:0.5px;"/>
  <text x="382" y="85" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-size:13px;font-weight:500;font-family:monospace;">Full pool fetch</text>
  <text x="382" y="101" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180,178,169);font-size:11px;font-family:monospace;">30 pages × 100 = 3,000 markets</text>
  <text x="382" y="116" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239,159,39);font-size:10px;font-family:monospace;">⚠ tag_slug / q / order ถูก API ignore</text>
</g>

<!-- Arrow -->
<line x1="498" y1="97" x2="538" y2="97" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

<!-- Phrase keyword match box -->
<g onclick="sendPrompt('_phrase_match ทำงานยังไง และ keyword ของแต่ละ signal type คืออะไร')">
  <rect x="538" y="68" width="180" height="58" rx="8" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);stroke-width:0.5px;"/>
  <text x="628" y="85" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-size:13px;font-weight:500;font-family:monospace;">Phrase match</text>
  <text x="628" y="101" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180,178,169);font-size:11px;font-family:monospace;">client-side substring</text>
  <text x="628" y="116" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180,178,169);font-size:10px;font-family:monospace;">multi-word phrases only</text>
</g>

<!-- Arrow -->
<line x1="718" y1="97" x2="758" y2="97" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

<!-- Slug registry box -->
<g onclick="sendPrompt('pm_slug_registry table schema คืออะไร')">
  <rect x="758" y="68" width="130" height="58" rx="8" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);stroke-width:0.5px;"/>
  <text x="823" y="88" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-size:13px;font-weight:500;font-family:monospace;">Slug registry</text>
  <text x="823" y="106" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:11px;font-family:monospace;">SQLite cache</text>
  <text x="823" y="120" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:10px;font-family:monospace;">10-min pool TTL</text>
</g>

<!-- Down arrow from layer 1 to layer 2 -->
<line x1="470" y1="140" x2="470" y2="162" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

<!-- ═══════════════════════════════════════════════════════════
     LAYER 2 — Signal Extraction (8 types)
═══════════════════════════════════════════════════════════ -->
<text x="40" y="180" style="font-size:11px;fill:rgb(156,154,146);font-family:monospace;">ชั้น 2 — Signal Extraction  (sort by volume → top-1 per type → outcomePrices[0])</text>
<rect x="40" y="190" width="860" height="80" rx="10" style="fill:rgb(38,38,36);stroke:rgba(222,220,209,0.3);stroke-width:0.5px;stroke-dasharray:4px,3px;"/>

<!-- Fed Rate -->
<g onclick="sendPrompt('แสดง keyword list สำหรับ fed_rate signal type และตัวอย่าง market ที่เจอ')">
