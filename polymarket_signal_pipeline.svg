  <text x="97" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-size:12px;font-weight:500;font-family:monospace;">Fed Rate</text>
  <text x="97" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-size:10px;font-family:monospace;">"fed rate cut"</text>
